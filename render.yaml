services:
  - type: web
    name: madar-amney
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120 "run:app"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: MADAR_ADMIN_PASSWORD
        sync: false
      - key: MADAR_MANAGER_PASSWORD
        sync: false
      - key: MADAR_OFFICER_PASSWORD
        sync: false
